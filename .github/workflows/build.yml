name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build-macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --release -p lol-remote --target aarch64-apple-darwin
          cargo build --release -p lol-remote --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/lol-remote \
            target/aarch64-apple-darwin/release/lol-remote \
            target/x86_64-apple-darwin/release/lol-remote
          lipo -info dist/lol-remote
          # Artifacts drop the executable bit; a tarball keeps it.
          tar -czf dist/lol-remote-macos-universal.tar.gz -C dist lol-remote
      - uses: actions/upload-artifact@v4
        with:
          name: lol-remote-macos-universal
          path: dist/lol-remote-macos-universal.tar.gz

  build-windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p lol-remote
      - uses: actions/upload-artifact@v4
        with:
          name: lol-remote-windows
          path: target/release/lol-remote.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mkdir -p release
          cp artifacts/lol-remote-macos-universal/lol-remote-macos-universal.tar.gz release/
          cp artifacts/lol-remote-windows/lol-remote.exe release/lol-remote-windows.exe
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
